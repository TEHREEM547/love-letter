
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Love Letter ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Floating Hearts -->
    <div class="hearts">
        <span>❤️</span>
        <span>💕</span>
        <span>💗</span>
        <span>💖</span>
        <span>❤️</span>
        <span>💘</span>
        <span>💕</span>
    </div>

    <div class="container">

        <h1 class="heading">A Letter For You ❤️</h1>

        <!-- Envelope -->
        <div class="envelope" id="envelope">

            <div class="envelope-back"></div>

            <div class="letter" id="letter">
                <h2>My Love ❤️</h2>

                <p id="loveText"></p>

                <h3 class="signature">Forever Yours 💋</h3>
            </div>

            <div class="envelope-front"></div>
            <div class="flap"></div>

            <div class="heart">❤️</div>

        </div>

        <button id="openBtn" onclick="openLetter()">
            Open My Letter 💌
        </button>

        <p class="bottom-text">
            Made with Love ❤️ Just For You
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
